[project]
name = "quire"
version = "0.1.1"
description = "Typed decisions from a frozen language model: one read of the state, every question answered from it."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=2.0",
    "scipy>=1.14",
    "fastapi>=0.115",
    "uvicorn>=0.32",
]

[project.optional-dependencies]
# Apple Silicon
mlx = ["mlx>=0.32.2", "mlx-lm>=0.31.3"]
# NVIDIA GPUs
torch = ["torch>=2.6", "transformers>=5.0", "accelerate>=1.0",
         # Gated DeltaNet kernels; without them transformers falls back to a slow reference path.
         # causal-conv1d is optional (needs nvcc to build) and measured no faster here.
         "flash-linear-attention>=0.5"]
# optional LoRA loading on the torch backend (not the released configuration)
lora = ["peft>=0.21"]
# training/: adapter training and synthetic data
train = ["peft>=0.21", "safetensors>=0.4"]
# training/teacher_label_llamacpp.py
teacher = ["llama-cpp-python>=0.3", "jinja2>=3.1"]
# benchmark harness integrations
bench = ["huggingface_hub>=0.30"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
quire-serve = "quire.daemon:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quire"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["model: loads model weights (slow)"]
